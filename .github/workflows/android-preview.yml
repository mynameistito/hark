name: Android Preview APK

on:
  pull_request:
    paths:
      - "apps/expo/**"
      - "apps/website/src/server/routes/devices.ts"
      - "apps/website/src/server/routes/hooks.ts"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://hark.ryan.ceo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Configure Firebase for push notifications
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/expo/google-services.json
          echo "GOOGLE_SERVICES_JSON_PATH=./google-services.json" >> "$GITHUB_ENV"

      - name: Prebuild Android project
        run: pnpm --filter @hark/expo exec expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: apps/expo/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hark-android-debug
          path: apps/expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
